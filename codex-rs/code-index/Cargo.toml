[package]
name = "codex-code-index"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "codex_code_index"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive"] }
codex-state = { workspace = true }
codex-file-watcher = { workspace = true }
codex-utils-absolute-path = { workspace = true }
codex-utils-home-dir = { workspace = true }
codex-utils-process = { workspace = true }
codex-utils-string = { workspace = true }
ignore = { workspace = true }
lru = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros", "rt-multi-thread", "signal", "time"] }
tree-sitter = { workspace = true }
tree-sitter-python = { workspace = true }
tree-sitter-rust = { workspace = true }
tree-sitter-typescript = { workspace = true }

[dev-dependencies]
codex-file-watcher = { workspace = true, features = ["test-support"] }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
